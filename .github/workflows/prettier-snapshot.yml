name: Prettier snapshot

on:
    pull_request:

permissions:
    contents: read

jobs:
    snapshot:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Format repository
              run: npm run format

            - name: Upload formatted files
              uses: actions/upload-artifact@v4
              with:
                  name: prettier-formatted
                  path: |
                      README.md
                      docs/releasing.md
                      docs/roadmap.md
                      demo/src/app/app.css
                      demo/src/app/app.html
                      demo/src/app/app.ts
                      demo/src/index.html
                      demo/src/main.ts
                      demo/src/styles.css
