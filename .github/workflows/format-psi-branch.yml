name: Format PSI branch

on:
    push:
        branches:
            - feat/psi-token-source-extractor

permissions:
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  ref: feat/psi-token-source-extractor

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Apply ktlint formatting
              run: ./gradlew ktlintFormat

            - name: Commit formatting
              run: |
                  if git diff --quiet; then
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add --all
                  git commit -m "style: apply ktlint formatting"
                  git push origin HEAD:feat/psi-token-source-extractor
