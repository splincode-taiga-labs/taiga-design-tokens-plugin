name: Rename packages

on:
    push:
        branches:
            - feat/psi-token-source-extractor
        paths:
            - .github/workflows/rename-packages.yml

permissions:
    contents: write

jobs:
    rename:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: feat/psi-token-source-extractor

            - name: Rename Kotlin packages
              run: |
                  git mv \
                      src/main/kotlin/org/taigaui/designtokens/packageindex \
                      src/main/kotlin/org/taigaui/designtokens/packageinfo
                  git mv \
                      src/main/kotlin/org/taigaui/designtokens/tokenindex \
                      src/main/kotlin/org/taigaui/designtokens/index
                  git mv \
                      src/test/kotlin/org/taigaui/designtokens/packageindex \
                      src/test/kotlin/org/taigaui/designtokens/packageinfo
                  git mv \
                      src/test/kotlin/org/taigaui/designtokens/tokenindex \
                      src/test/kotlin/org/taigaui/designtokens/index

                  find src -type f -name '*.kt' -print0 | xargs -0 sed -i \
                      -e 's/org\.taigaui\.designtokens\.packageindex/org.taigaui.designtokens.packageinfo/g' \
                      -e 's/org\.taigaui\.designtokens\.tokenindex/org.taigaui.designtokens.index/g'

                  rm .github/workflows/rename-packages.yml

            - name: Commit renamed packages
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add -A
                  git commit -m 'refactor: rename package namespaces'
                  git push origin HEAD:feat/psi-token-source-extractor
