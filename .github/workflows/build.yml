name: Build

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: 9.5.0

            - name: Test and build plugin
              run: gradle test buildPlugin verifyPlugin --stacktrace
