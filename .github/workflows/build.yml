name: Build

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    id-token: write

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      test-fixtures/package-lock.json

            - name: Install root npm fixture
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Install Taiga UI version workspaces
              run: npm run install:fixtures --prefix test-fixtures

            - name: Verify pnpm workspace frozen install
              working-directory: test-fixtures/package-manager-workspaces/pnpm-workspaces
              run: |
                  corepack pnpm install --frozen-lockfile --ignore-scripts
                  test -L apps/demo/node_modules/@taiga-ui/design-tokens
                  test -f apps/demo/node_modules/@taiga-ui/design-tokens/package.json
                  test "$(node -p "require('./apps/demo/node_modules/@taiga-ui/design-tokens/package.json').version")" = "0.322.0"
                  git diff --exit-code -- pnpm-lock.yaml

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Check and build plugin
              env:
                  JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
              run: >-
                  ./gradlew
                  check
                  buildPlugin
                  verifyPluginStructure
                  verifyPluginProjectConfiguration
                  -Djava.net.useSystemProxies=false
                  --stacktrace

            - name: Print JaCoCo coverage diagnostics
              run: |
                  python - <<'PY'
                  import xml.etree.ElementTree as ET
                  from pathlib import Path

                  report = Path("build/reports/jacoco/test/jacocoTestReport.xml")
                  root = ET.parse(report).getroot()

                  def counter(node, kind):
                      item = next(
                          (c for c in node.findall("counter") if c.attrib["type"] == kind),
                          None,
                      )
                      if item is None:
                          return 0, 0
                      return int(item.attrib["missed"]), int(item.attrib["covered"])

                  for kind in ("LINE", "BRANCH", "METHOD", "CLASS"):
                      missed, covered = counter(root, kind)
                      total = missed + covered
                      percent = 100.0 if total == 0 else covered * 100.0 / total
                      print(
                          f"COVERAGE {kind}: {percent:.2f}% "
                          f"(covered={covered}, missed={missed}, total={total})"
                      )

                  print("MISSED SOURCE LINES:")
                  missed_files = 0
                  for package in root.findall("package"):
                      package_name = package.attrib["name"]
                      for source in package.findall("sourcefile"):
                          missed_lines = [
                              line.attrib["nr"]
                              for line in source.findall("line")
                              if int(line.attrib.get("mi", "0")) > 0
                          ]
                          if not missed_lines:
                              continue

                          missed_files += 1
                          path = f"{package_name}/{source.attrib['name']}"
                          print(f"{path}: {','.join(missed_lines)}")

                  print(f"MISSED SOURCE FILES: {missed_files}")
                  PY

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  use_oidc: true
                  files: ./build/reports/jacoco/test/jacocoTestReport.xml
                  disable_search: true
                  flags: unit
                  name: unit-tests
                  fail_ci_if_error: true

            - name: Verify packaged plugin icons
              run: bash scripts/verify-plugin-icons.sh

    plugin-verifier:
        name: Plugin Verifier
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Cache IntelliJ Platform IDEs
              uses: actions/cache@v4
              with:
                  path: .intellijPlatform/ides
                  key: intellij-platform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
                  restore-keys: |
                      intellij-platform-${{ runner.os }}-

            - name: Verify plugin compatibility
              env:
                  JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
              run: >-
                  ./gradlew
                  verifyPlugin
                  -Djava.net.useSystemProxies=false
                  --stacktrace
